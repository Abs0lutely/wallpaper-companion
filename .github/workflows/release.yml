name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching pyproject.toml, e.g. v0.6.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:REQUESTED_TAG -ne "v$version") { throw 'Tag must match pyproject.toml version' }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Prepare Inno Setup
        shell: pwsh
        run: ./scripts/bootstrap_inno.ps1
      - run: python scripts/build_windows.py
      - name: Verify binaries and installation
        shell: pwsh
        run: |
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          python scripts/verify_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; preserving its verified assets. Build artifacts are available in this workflow.'
          } else {
            $dialogueAssets = @('examples/dialogues/heartfelt-zh-CN.json', 'examples/dialogues/heartfelt-zh-CN.txt',
              'examples/dialogues/starter-en-US.json', 'examples/dialogues/starter-en-US.txt',
              'examples/dialogues/starter-ja-JP.json', 'examples/dialogues/starter-ja-JP.txt',
              'examples/dialogues/operation-en-US.json', 'examples/dialogues/operation-en-US.txt',
              'examples/dialogues/operation-ja-JP.json', 'examples/dialogues/operation-ja-JP.txt',
              'examples/presets/operation-voice-rules-en-US.json', 'examples/presets/operation-voice-rules-ja-JP.json',
              'examples/presets/interaction-ja-JP.json', 'examples/presets/interaction-en-US.json',
              'examples/dialogues/TRANSLATIONS.md')
            $notesPath = "release-notes/$env:RELEASE_TAG.md"
            $notesArgs = @('--generate-notes')
            if (Test-Path -LiteralPath $notesPath) { $notesArgs = @('--notes-file', $notesPath) }
            gh release create $env:RELEASE_TAG dist/release/* @dialogueAssets --target $env:GITHUB_SHA --title "Wallpaper Companion $env:RELEASE_TAG" @notesArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
